[pytest]
testpaths = tests
python_files = test_*.py
markers =
    slow: tests that re-run the pipeline (use -m "not slow" to skip)
    frontend: headless-browser checks with an automatically started local server (run with `pytest -m frontend`)
    data_quality: Datenspiegel — Tests, die behaupten, dass die Quelle sauber ist. Absichtlich rot, solange bekannte Quellfehler bestehen. Lauf: pytest -m data_quality. Invariantenlauf: pytest -m "not data_quality and not slow"
filterwarnings =
    ignore::DeprecationWarning
