  <!-- One top bar in two rows: the blue brand band with brand, badge and info
       links, the white tab row below it, both reaching the window edge. The
       subtitle lives in the brand tooltip, because the band has room for one
       line only. -->
  <header class="topbar topbar--app">
    <h1 class="visually-hidden">M³GIM — Teilnachlass Ira Malaniuk, UAKUG/NIM</h1>
    <div class="topbar__lead">
      <a href="index.html" class="topbar__brand" title="Teilnachlass Ira Malaniuk — UAKUG/NIM">M³GIM</a>
      <a href="projekt.html" class="topbar__badge">Research Preview</a>
    </div>

    <!-- Tab Bar — three visible groups (E-160). The group wrappers carry
         role="none" so the tabs stay direct children of the tablist in the
         accessibility tree; the grouping is a visual ordering, not a semantic
         level the screen reader has to walk through. -->
    <nav class="tab-bar" aria-label="Hauptnavigation" role="tablist">
    <div class="tab-bar__group" role="none" data-group="material">
      <button class="tab-bar__tab active" data-tab="bestand" role="tab" aria-selected="true" aria-controls="tab-bestand" id="btn-bestand" tabindex="0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>
        </svg>
        <span class="tab-bar__label">Bestand</span>
      </button>
      <button class="tab-bar__tab" data-tab="indizes" role="tab" aria-selected="false" aria-controls="tab-indizes" id="btn-indizes" tabindex="-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 22h2a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"/><path d="M14 2v5h5"/><path d="M3 15h6"/><path d="M3 19h4"/><path d="M3 11h8"/>
        </svg>
        <span class="tab-bar__label">Indizes</span>
      </button>
    </div>

    <div class="tab-bar__group" role="none" data-group="perspektiven">
      <button class="tab-bar__tab" data-tab="chronik" role="tab" aria-selected="false" aria-controls="tab-chronik" id="btn-chronik" tabindex="-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="tab-bar__label">Chronik</span>
      </button>
      <button class="tab-bar__tab" data-tab="karte" role="tab" aria-selected="false" aria-controls="tab-karte" id="btn-karte" tabindex="-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>

      <button class="tab-bar__tab" data-tab="netzwerk" role="tab" aria-selected="false" aria-controls="tab-netzwerk" id="btn-netzwerk" tabindex="-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="12" r="2"/><path d="M6.5 6.5 10.5 10.5"/><path d="M17.5 6.5 13.5 10.5"/><path d="M6.5 17.5 10.5 13.5"/><path d="M17.5 17.5 13.5 13.5"/>
        </svg>
        <span class="tab-bar__label">Netzwerk</span>
      </button>
      <button class="tab-bar__tab" data-tab="statistik" role="tab" aria-selected="false" aria-controls="tab-statistik" id="btn-statistik" tabindex="-1">

        </svg>
        <span class="tab-bar__label">Statistik</span>
      </button>
    </div>

    <div class="tab-bar__group" role="none" data-group="werkzeug">
      <!-- Tray, not a bookmark glyph: the Korb collects several documents,
           a bookmark marks a single place. The same sign marks every
           add-to-Korb button; source of truth for the paths below is
           korbIcon() in js/data/constants.js, keep both identical. -->
      <button class="tab-bar__tab" data-tab="korb" id="korb-tab-btn" role="tab" aria-selected="false" aria-controls="tab-korb" tabindex="-1"

        </svg>
        <span class="tab-bar__label">Korb</span>
        <span class="tab-bar__badge" id="korb-badge" aria-label="Anzahl Einträge im Korb">0</span>
      </button>
    </div>
